<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">M.G.N CodeWave</title>
  <desc id="desc">Image de partage pour M.G.N CodeWave, agence web au Gabon.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#004AAD" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="1020" cy="120" r="180" fill="#ffffff" opacity="0.06" />
  <circle cx="160" cy="560" r="220" fill="#ffffff" opacity="0.04" />

  <!-- Onde de signature, reprise du monogramme. -->
  <path d="M0 548c90-52 158 52 240 0s158-52 240 0 158 52 240 0 158-52 240 0 158 52 240 0"
        fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.5" stroke-linecap="round" />

  <!-- Monogramme M.G.N CodeWave, identique au logo du site. -->
  <g transform="translate(90 72) scale(1.75)">
    <rect width="64" height="64" rx="14" fill="#0B1220" />
    <g fill="none" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M7.5 43V21l6 11 6-11v22" stroke="#E2E8F0" />
      <path d="M38 26A8.5 8.5 0 1 0 40.5 32H33.5" stroke="#3B82F6" />
      <path d="M44.5 43V21l12 22V21" stroke="#E2E8F0" />
    </g>
    <path d="M8 51.5c6-3.5 10.5 3.5 16 0s10.5-3.5 16 0 10.5 3.5 16 0" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <rect x="90" y="228" width="220" height="8" rx="4" fill="url(#accent)" />

  <text x="90" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="700" fill="#ffffff">
