  </text>

  <rect x="90" y="486" width="466" height="64" rx="8" fill="#ffffff" opacity="0.12" />
  <text x="118" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff">
